name: SEB static artifact audit

on:
  push:
    branches:
      - redteam/monitoring-audit-2026-10-09
    paths:
      - '**/*.exe'
      - '**/*.dll'
      - '**/*.config'
      - 'SebWindowsBrowser/**'
      - 'rea-main/**'
      - '.github/workflows/seb-static-audit.yml'
  workflow_dispatch:

concurrency:
  group: seb-static-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-managed-audit:
    name: Build REA and inspect supplied PE/CLI artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the investigation branch
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up the Node.js version specified by REA
        uses: actions/setup-node@v4
        with:
          node-version-file: rea-main/.nvmrc
          cache: npm
          cache-dependency-path: rea-main/package-lock.json

      - name: Prepare output directory
        run: mkdir -p "$GITHUB_WORKSPACE/audit-output"

      - name: Install pinned REA dependencies
        working-directory: rea-main
        run: npm ci

      - name: Build REA
        working-directory: rea-main
        run: npm run build:cached

      - name: Check REA types and lint
        working-directory: rea-main
        run: npm run check:fast

      - name: Run REA fast test suite
        working-directory: rea-main
        run: npm run test:fast

      - name: Inspect application, service and contracts without executing targets
        working-directory: rea-main
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/audit-output"
          for target in SecureExamBrowser.exe SebWindowsServiceWCF.exe SEBWindowsServiceContracts.dll; do
            path="$GITHUB_WORKSPACE/$target"
            node scripts/rea.mjs inspect-managed-artifact "$path" --json > "$out/$target.artifact.json"
            node scripts/rea.mjs inspect-managed-members "$path" --json > "$out/$target.members.json"
            node scripts/rea.mjs inspect-managed-native-boundaries "$path" --json > "$out/$target.native-boundaries.json"
          done

      - name: Upload static-analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seb-static-analysis
          path: audit-output/
          if-no-files-found: warn
          retention-days: 7

  windows-artifact-provenance:
    name: Hash files and inspect Authenticode signatures without execution
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out investigation branch
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download current public vendor packages (do not execute)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'audit-output'
          $downloads = Join-Path $env:RUNNER_TEMP 'hirepro-published-packages'
          New-Item -ItemType Directory -Force -Path $outDir, $downloads | Out-Null
          $published = @(
            @{ name = 'Chromium_1.0.1_signed.msi'; url = 'https://securetest.hirepro.in/s3_cached/hirepro-content/hirepro/paas/Chromium_1.0.1_signed.msi' },
            @{ name = 'SecureExamBrowserInstaller_en_2.0.2.msi'; url = 'https://securetest.hirepro.in/s3_cached/hirepro-content/hirepro/paas/SecureExamBrowserInstaller_en_2.0.2.msi' }
          )
          foreach ($entry in $published) {
            $destination = Join-Path $downloads $entry.name
            Invoke-WebRequest -Uri $entry.url -OutFile $destination -MaximumRedirection 5
            if (-not (Test-Path -LiteralPath $destination -PathType Leaf)) { throw "Download missing: $($entry.name)" }
          }
          $published | ForEach-Object { [pscustomobject]@{ name = $_.name; url = $_.url } } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $outDir 'published-package-sources.json') -Encoding utf8

      - name: Record hashes and signature metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $outDir = Join-Path $root 'audit-output'
          $downloads = Join-Path $env:RUNNER_TEMP 'hirepro-published-packages'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $targets = @(
            @{ path = 'SecureExamBrowser.exe'; fullPath = (Join-Path $root 'SecureExamBrowser.exe'); kind = 'repository-checkout' },
            @{ path = 'SebWindowsServiceWCF.exe'; fullPath = (Join-Path $root 'SebWindowsServiceWCF.exe'); kind = 'repository-checkout' },
            @{ path = 'SEBWindowsServiceContracts.dll'; fullPath = (Join-Path $root 'SEBWindowsServiceContracts.dll'); kind = 'repository-checkout' },
            @{ path = 'hirepro-chromium-installer.exe'; fullPath = (Join-Path $root 'hirepro-chromium-installer.exe'); kind = 'repository-checkout' },
            @{ path = 'vendor/Chromium_1.0.1_signed.msi'; fullPath = (Join-Path $downloads 'Chromium_1.0.1_signed.msi'); kind = 'downloaded-from-public-vendor-page' },
            @{ path = 'vendor/SecureExamBrowserInstaller_en_2.0.2.msi'; fullPath = (Join-Path $downloads 'SecureExamBrowserInstaller_en_2.0.2.msi'); kind = 'downloaded-from-public-vendor-page' }
          )
          $results = foreach ($target in $targets) {
            $fullPath = $target.fullPath
            if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
              [pscustomobject]@{ path = $target.path; kind = $target.kind; error = 'File not found' }
              continue
            }
            $item = Get-Item -LiteralPath $fullPath
            $hash = Get-FileHash -LiteralPath $fullPath -Algorithm SHA256
            $signature = Get-AuthenticodeSignature -LiteralPath $fullPath
            $signer = $signature.SignerCertificate
            $timestamp = $signature.TimeStamperCertificate
            [pscustomobject]@{
              path = $target.path
              kind = $target.kind
              bytes = $item.Length
              sha256 = $hash.Hash.ToLowerInvariant()
              signatureStatus = $signature.Status.ToString()
              signatureMessage = $signature.StatusMessage
              signerSubject = if ($signer) { $signer.Subject } else { $null }
              signerIssuer = if ($signer) { $signer.Issuer } else { $null }
              signerThumbprint = if ($signer) { $signer.Thumbprint } else { $null }
              signerNotBefore = if ($signer) { $signer.NotBefore.ToUniversalTime().ToString('o') } else { $null }
              signerNotAfter = if ($signer) { $signer.NotAfter.ToUniversalTime().ToString('o') } else { $null }
              timestampSubject = if ($timestamp) { $timestamp.Subject } else { $null }
              timestampThumbprint = if ($timestamp) { $timestamp.Thumbprint } else { $null }
            }
          }
          $jsonPath = Join-Path $outDir 'windows-artifact-provenance.json'
          $results | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $jsonPath -Encoding utf8
          Get-Content -LiteralPath $jsonPath

      - name: Extract published MSIs without installation and compare component hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install lessmsi --version=2.12.9 --yes --no-progress
          $lessmsi = (Get-Command lessmsi.exe -ErrorAction Stop).Source
          $root = $env:GITHUB_WORKSPACE
          $outDir = Join-Path $root 'audit-output'
          $downloads = Join-Path $env:RUNNER_TEMP 'hirepro-published-packages'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'hirepro-extracted-packages'
          New-Item -ItemType Directory -Force -Path $outDir, $extractRoot | Out-Null
          $packages = @(
            @{ name = 'Chromium_1.0.1_signed.msi'; output = (Join-Path $extractRoot 'chromium') },
            @{ name = 'SecureExamBrowserInstaller_en_2.0.2.msi'; output = (Join-Path $extractRoot 'seb') }
          )
          foreach ($package in $packages) {
            $source = Join-Path $downloads $package.name
            New-Item -ItemType Directory -Force -Path $package.output | Out-Null
            $destination = (Resolve-Path -LiteralPath $package.output).Path + [IO.Path]::DirectorySeparatorChar
            & $lessmsi x $source $destination
            if ($LASTEXITCODE -ne 0) { throw "lessmsi extraction failed for $($package.name)" }
          }
          $allExtracted = Get-ChildItem -LiteralPath $extractRoot -Recurse -File
          $repoFiles = Get-ChildItem -LiteralPath $root -File | Where-Object { $_.Extension.ToLowerInvariant() -in @('.exe', '.dll') } | Sort-Object Name
          $comparison = foreach ($repoFile in $repoFiles) {
            $name = $repoFile.Name
            $repoHash = (Get-FileHash -LiteralPath $repoFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $candidates = foreach ($file in ($allExtracted | Where-Object { $_.Name -ieq $name })) {
              $h = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
              [pscustomobject]@{
                packageRelativePath = $file.FullName.Substring($extractRoot.Length).TrimStart('\','/')
                bytes = $file.Length
                sha256 = $h.Hash.ToLowerInvariant()
                exactlyMatchesRepositoryFile = $h.Hash.Equals($repoHash, [StringComparison]::OrdinalIgnoreCase)
              }
            }
            [pscustomobject]@{
              repositoryPath = $name
              repositoryBytes = $repoFile.Length
              repositorySha256 = $repoHash
              packageCandidates = @($candidates)
              anyExactHashMatch = @($candidates | Where-Object { $_.exactlyMatchesRepositoryFile }).Count -gt 0
            }
          }
          $comparison | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $outDir 'vendor-package-component-comparison.json') -Encoding utf8
          Get-Content -LiteralPath (Join-Path $outDir 'vendor-package-component-comparison.json')

          # Compare selected legacy XUL source/config files against the full extracted package.
          # This determines source/package correspondence only; it does not execute these files.
          $sourceRelativePaths = @(
            'SebWindowsBrowser/xul_seb/modules/SebScreenshot.jsm',
            'SebWindowsBrowser/xul_seb/modules/SebServer.jsm',
            'SebWindowsBrowser/xul_seb/modules/SebHost.jsm',
            'SebWindowsBrowser/xul_seb/modules/SebConfig.jsm',
            'SebWindowsBrowser/xul_seb/modules/seb.jsm',
            'SebWindowsBrowser/xul_seb/config.default.json',
            'SebWindowsBrowser/xul_seb/config.json',
            'SebWindowsBrowser/xul_seb/config.SEB22.json',
            'SebWindowsBrowser/xul_seb/chrome/content/seb/seb.xul',
            'SebWindowsBrowser/xul_seb/chrome/content/seb/message_socket.html',
            'SebWindowsBrowser/xul_seb/chrome.manifest',
            'SebWindowsBrowser/xul_seb/defaults/preferences/seb.js'
          )
          $sourceComparison = foreach ($relativePath in $sourceRelativePaths) {
            $sourcePath = Join-Path $root $relativePath
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              [pscustomobject]@{ sourcePath = $relativePath; error = 'Source file not found'; packageCandidates = @() }
              continue
            }
            $sourceFile = Get-Item -LiteralPath $sourcePath
            $sourceHash = (Get-FileHash -LiteralPath $sourcePath -Algorithm SHA256).Hash.ToLowerInvariant()
            $candidates = foreach ($file in ($allExtracted | Where-Object { $_.Name -ieq $sourceFile.Name })) {
              $h = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              [pscustomobject]@{
                packageRelativePath = $file.FullName.Substring($extractRoot.Length).TrimStart('\','/')
                bytes = $file.Length
                sha256 = $h
                exactlyMatchesRepositorySource = $h -eq $sourceHash
              }
            }
            [pscustomobject]@{
              sourcePath = $relativePath
              sourceBytes = $sourceFile.Length
              sourceSha256 = $sourceHash
              packageCandidates = @($candidates)
              exactMatchCount = @($candidates | Where-Object { $_.exactlyMatchesRepositorySource }).Count
              sameNamedPackageFileCount = @($candidates).Count
            }
          }
          $sourceComparison | ConvertTo-Json -Depth 7 | Set-Content -LiteralPath (Join-Path $outDir 'legacy-source-package-comparison.json') -Encoding utf8
          Get-Content -LiteralPath (Join-Path $outDir 'legacy-source-package-comparison.json')

      - name: Upload Windows provenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact-provenance
          path: audit-output/windows-artifact-provenance.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload public-package component comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vendor-package-component-comparison
          path: audit-output/vendor-package-component-comparison.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload legacy source/package comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-source-package-comparison
          path: audit-output/legacy-source-package-comparison.json
          if-no-files-found: warn
          retention-days: 7
